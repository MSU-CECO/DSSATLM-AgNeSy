services:
  weather-api:
    build:
      context: .
      dockerfile: services/weather-api/Dockerfile
    expose:
      - "8001"
    env_file:
      - services/weather-api/.env
    volumes:
      - /data/kpodojos/phd_paper2:/data/kpodojos/phd_paper2:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    expose:
      - "8002"
    env_file:
      - services/backend/.env
    restart: unless-stopped
    depends_on:
      - weather-api

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - weather-api
    restart: unless-stopped
