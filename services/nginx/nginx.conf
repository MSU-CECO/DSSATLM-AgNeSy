server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Health check passthrough
    location /health {
        proxy_pass http://backend:8002/health;
        proxy_http_version 1.1;
    }

    # Proxy /api/ to FastAPI backend
    location /api/ {
        proxy_pass http://backend:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Proxy /weather/ to Weather API
    location /weather/ {
        proxy_pass http://weather-api:8001/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
